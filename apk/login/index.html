<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSM Login</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f0f0f;
    font-family: 'Segoe UI', sans-serif;
    flex-direction: column;
    gap: 16px;
    padding: 20px;
  }
  .notice-bar {
    background: #1c3a5e;
    border: 1px solid #2563eb;
    border-radius: 10px;
    padding: 12px 16px;
    width: 90%;
    max-width: 380px;
    color: #93c5fd;
    font-size: 13px;
    display: none;
  }
  .card {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 16px;
    padding: 40px 32px;
    width: 90%;
    max-width: 380px;
    text-align: center;
  }
  h2 { color: #fff; margin-bottom: 8px; font-size: 22px; }
  p { color: #888; font-size: 13px; margin-bottom: 28px; }
  .google-btn {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid #444;
    background: #fff;
    color: #333;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .google-btn img { width: 20px; }
  .status { margin-top: 16px; font-size: 13px; color: #888; min-height: 20px; }
  .error { color: #f87171; }
  .success { color: #4ade80; }
</style>
</head>
<body>

<div class="notice-bar" id="notice-bar">📢 <span id="notice-text"></span></div>

<div class="card">
  <h2>🔐 CSM Access</h2>
  <p>Sign in with your Google account</p>
  <button class="google-btn" onclick="signIn()">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg">
    Sign in with Google
  </button>
  <div class="status" id="status"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithRedirect, getRedirectResult } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDYQEmr9dM32hiXHTfYswH6xyeusD67urg",
  authDomain: "csmkohinapk.firebaseapp.com",
  projectId: "csmkohinapk",
  storageBucket: "csmkohinapk.firebasestorage.app",
  messagingSenderId: "242746054882",
  appId: "1:242746054882:web:342c52a8d5e6ee733ba6bb"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();
  const status = document.getElementById('status');

  // Notice load
  getDoc(doc(db, "config", "notice")).then((d) => {
    if (d.exists() && d.data().text) {
      document.getElementById('notice-text').textContent = d.data().text;
      document.getElementById('notice-bar').style.display = 'block';
    }
  });

  // Redirect result
  getRedirectResult(auth).then(async (result) => {
    if (!result) return;

    status.textContent = "Checking access...";
    const user = result.user;
    const userRef = doc(db, "users", user.uid);
    const userDoc = await getDoc(userRef);

    if (!userDoc.exists()) {
      // নতুন user — save করো, সরাসরি access দাও
      await setDoc(userRef, {
        name: user.displayName,
        email: user.email,
        photo: user.photoURL,
        disabled: false,
        createdAt: Date.now()
      });
    } else {
      const data = userDoc.data();

      // Disabled check
      if (data.disabled) {
        status.className = 'status error';
        status.textContent = "❌ Your access is disabled.";
        setTimeout(() => {
          window.location.href = "https://mohasin.bro.bd/apk/login?success=false";
        }, 1500);
        return;
      }

      // Time expire check
      const now = Date.now();
      if (data.expireAt && data.expireAt < now) {
        status.className = 'status error';
        status.textContent = "⏰ Your time has expired.";
        setTimeout(() => {
          window.location.href = "https://mohasin.bro.bd/apk/login?success=false";
        }, 1500);
        return;
      }

      // Time বাকি থাকলে pass করো
      const timeLeft = data.expireAt ? data.expireAt - now : 0;
      status.className = 'status success';
      status.textContent = "✅ Access granted!";
      setTimeout(() => {
        if (timeLeft > 0) {
          window.location.href = `https://mohasin.bro.bd/apk/login?success=true&time=${timeLeft}`;
        } else {
          window.location.href = "https://mohasin.bro.bd/apk/login?success=true";
        }
      }, 1000);
      return;
    }

    // নতুন user direct access
    status.className = 'status success';
    status.textContent = "✅ Access granted!";
    setTimeout(() => {
      window.location.href = "https://mohasin.bro.bd/apk/login?success=true";
    }, 1000);

  }).catch((err) => {
    status.className = 'status error';
    status.textContent = "Error: " + err.message;
  });

  window.signIn = () => {
    status.textContent = "Redirecting to Google...";
    signInWithRedirect(auth, provider);
  };
</script>
</body>
</html>
