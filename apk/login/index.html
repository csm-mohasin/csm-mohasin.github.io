<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSM Login</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f0f0f;
    font-family: 'Segoe UI', sans-serif;
    flex-direction: column;
    gap: 16px;
    padding: 20px;
  }
  .notice-bar {
    background: #1c3a5e;
    border: 1px solid #2563eb;
    border-radius: 10px;
    padding: 12px 16px;
    width: 90%;
    max-width: 380px;
    color: #93c5fd;
    font-size: 13px;
    display: none;
  }
  .card {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 16px;
    padding: 40px 32px;
    width: 90%;
    max-width: 380px;
    text-align: center;
  }
  h2 { color: #fff; margin-bottom: 8px; font-size: 22px; }
  p { color: #888; font-size: 13px; margin-bottom: 28px; }
  .google-btn {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid #444;
    background: #fff;
    color: #333;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .google-btn img { width: 20px; }
  .field {
    width: 100%;
    padding: 13px 14px;
    margin-bottom: 12px;
    border-radius: 10px;
    border: 1px solid #444;
    background: #0f0f0f;
    color: #fff;
    font-size: 15px;
    outline: none;
  }
  .field:focus { border-color: #2563eb; }
  .main-btn {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: none;
    background: #2563eb;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .main-btn:disabled { opacity: .6; cursor: default; }
  .toggle { margin-top: 16px; font-size: 13px; color: #93c5fd; cursor: pointer; margin-bottom: 0; }
  .status { margin-top: 16px; font-size: 13px; color: #888; min-height: 20px; }
  .error { color: #f87171; }
  .success { color: #4ade80; }
</style>
</head>
<body>

<div class="notice-bar" id="notice-bar">📢 <span id="notice-text"></span></div>

<div class="card">
  <h2>🔐 CSM Access</h2>
  <p id="subtitle">Sign in with your email and password</p>
  <input class="field" type="email" id="email" placeholder="Email" autocomplete="email">
  <input class="field" type="password" id="password" placeholder="Password (min 6 characters)" autocomplete="current-password">
  <button class="main-btn" id="submit-btn" onclick="submitForm()">Sign In</button>
  <p class="toggle" id="toggle" onclick="toggleMode()">New here? Create account</p>
  <div class="status" id="status"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_AUTH_DOMAIN",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_STORAGE_BUCKET",
    messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  const ADMIN_EMAIL = "admin@mohasin.bro.bd";

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const status = document.getElementById('status');
  const btn = document.getElementById('submit-btn');
  let isSignUp = false;

  // Notice load
  getDoc(doc(db, "config", "notice")).then((d) => {
    if (d.exists() && d.data().text) {
      document.getElementById('notice-text').textContent = d.data().text;
      document.getElementById('notice-bar').style.display = 'block';
    }
  });

  function setStatus(msg, cls = '') {
    status.className = 'status ' + cls;
    status.textContent = msg;
  }

  function friendlyError(err) {
    switch (err.code) {
      case 'auth/invalid-email': return 'Invalid email address.';
      case 'auth/missing-password': return 'Please enter your password.';
      case 'auth/weak-password': return 'Password must be at least 6 characters.';
      case 'auth/email-already-in-use': return 'This email is already registered. Please sign in.';
      case 'auth/user-not-found':
      case 'auth/wrong-password':
      case 'auth/invalid-credential': return 'Wrong email or password.';
      case 'auth/too-many-requests': return 'Too many attempts. Try again later.';
      case 'auth/operation-not-allowed': return 'Email/Password login is not enabled in Firebase.';
      default: return err.message;
    }
  }

  function redirect(success, timeLeft = 0) {
    const base = "https://mohasin.bro.bd/apk/login?success=" + success;
    window.location.href = (success && timeLeft > 0) ? base + "&time=" + timeLeft : base;
  }

  async function checkAccess(user) {
    setStatus("Checking access...");
    const userRef = doc(db, "users", user.uid);
    const userDoc = await getDoc(userRef);

    if (!userDoc.exists()) {
      // নতুন user — save করো, সরাসরি access দাও
      await setDoc(userRef, {
        name: user.displayName || user.email.split('@')[0],
        email: user.email,
        photo: user.photoURL || "",
        disabled: false,
        createdAt: Date.now()
      });
      setStatus("✅ Access granted!", 'success');
      setTimeout(() => redirect(true), 1000);
      return;
    }

    const data = userDoc.data();

    // Disabled check
    if (data.disabled) {
      setStatus("❌ Your access is disabled.", 'error');
      setTimeout(() => redirect(false), 1500);
      return;
    }

    // Time expire check
    const now = Date.now();
    if (data.expireAt && data.expireAt < now) {
      setStatus("⏰ Your time has expired.", 'error');
      setTimeout(() => redirect(false), 1500);
      return;
    }

    // Time বাকি থাকলে pass করো
    const timeLeft = data.expireAt ? data.expireAt - now : 0;
    setStatus("✅ Access granted!", 'success');
    setTimeout(() => redirect(true, timeLeft), 1000);
  }

  window.toggleMode = () => {
    isSignUp = !isSignUp;
    document.getElementById('subtitle').textContent = isSignUp ? "Create your account" : "Sign in with your email and password";
    btn.textContent = isSignUp ? "Create Account" : "Sign In";
    document.getElementById('toggle').textContent = isSignUp ? "Already have an account? Sign in" : "New here? Create account";
    document.getElementById('password').autocomplete = isSignUp ? "new-password" : "current-password";
    setStatus("");
  };

  window.submitForm = async () => {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    if (!email || !password) {
      setStatus("Enter email and password.", 'error');
      return;
    }
    if (isSignUp && email.toLowerCase() === ADMIN_EMAIL) {
      setStatus("This email can't be registered here.", 'error');
      return;
    }

    btn.disabled = true;
    setStatus(isSignUp ? "Creating account..." : "Signing in...");
    try {
      const cred = isSignUp
        ? await createUserWithEmailAndPassword(auth, email, password)
        : await signInWithEmailAndPassword(auth, email, password);
      await checkAccess(cred.user);
    } catch (err) {
      setStatus(friendlyError(err), 'error');
    } finally {
      btn.disabled = false;
    }
  };

  // Enter key submits
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') window.submitForm();
  });
</script>
</body>
</html>
