<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSM Login</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f0f0f;
    font-family: 'Segoe UI', sans-serif;
    flex-direction: column;
    gap: 16px;
    padding: 20px;
  }
  .notice-bar {
    background: #1c3a5e;
    border: 1px solid #2563eb;
    border-radius: 10px;
    padding: 12px 16px;
    width: 90%;
    max-width: 380px;
    color: #93c5fd;
    font-size: 13px;
    display: none;
  }
  .card {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 16px;
    padding: 40px 32px;
    width: 90%;
    max-width: 380px;
    text-align: center;
  }
  h2 { color: #fff; margin-bottom: 8px; font-size: 22px; }
  p { color: #888; font-size: 13px; margin-bottom: 28px; }
  .google-btn {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid #444;
    background: #fff;
    color: #333;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .google-btn img { width: 20px; }
  .field {
    width: 100%;
    padding: 13px 14px;
    margin-bottom: 12px;
    border-radius: 10px;
    border: 1px solid #444;
    background: #0f0f0f;
    color: #fff;
    font-size: 15px;
    outline: none;
  }
  .field:focus { border-color: #2563eb; }
  .main-btn {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: none;
    background: #2563eb;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .main-btn:disabled { opacity: .6; cursor: default; }
  .toggle { margin-top: 16px; font-size: 13px; color: #93c5fd; cursor: pointer; margin-bottom: 0; }
  .status { margin-top: 16px; font-size: 13px; color: #888; min-height: 20px; }
  .error { color: #f87171; }
  .success { color: #4ade80; }
</style>
</head>
<body>

<div class="notice-bar" id="notice-bar">📢 <span id="notice-text"></span></div>

<div class="card">
  <h2>🔐 CSM Access</h2>
  <p id="subtitle">Sign in with your email and password</p>
  <div id="login-view">
  <input class="field" type="email" id="email" placeholder="Email" autocomplete="email">
  <input class="field" type="password" id="password" placeholder="Password (min 6 characters)" autocomplete="current-password">
  <input class="field" type="text" id="key" placeholder="Access key (required for new account)" autocomplete="off" autocapitalize="characters" style="display:none">
  <button class="main-btn" id="submit-btn" onclick="submitForm()">Sign In</button>
  <p class="toggle" id="toggle" onclick="toggleMode()">New here? Create account</p>
  </div>

  <div id="gate-view" style="display:none">
    <p id="gate-info" style="margin-bottom:16px;"></p>
    <input class="field" type="password" id="gate-pass" placeholder="Your password" autocomplete="current-password">
    <button class="main-btn" id="gate-btn" onclick="submitGate()">Continue</button>
    <p class="toggle" onclick="logout()">Not you? Sign out</p>
  </div>
  <div class="status" id="status"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence, EmailAuthProvider, reauthenticateWithCredential, deleteUser } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, runTransaction } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDYQEmr9dM32hiXHTfYswH6xyeusD67urg",
    authDomain: "csmkohinapk.firebaseapp.com",
    projectId: "csmkohinapk",
    storageBucket: "csmkohinapk.firebasestorage.app",
    messagingSenderId: "242746054882",
    appId: "1:242746054882:web:342c52a8d5e6ee733ba6bb"
  };

  const ADMIN_EMAIL = "admin@mohasin.bro.bd";

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const status = document.getElementById('status');
  const btn = document.getElementById('submit-btn');
  let isSignUp = false;
  let justSignedIn = false;

  // Login session browser e save thakbe (auto logout hobe na)
  setPersistence(auth, browserLocalPersistence).catch(() => {});

  // Age theke logged in thakle password gate dekhao
  onAuthStateChanged(auth, (user) => {
    if (justSignedIn) return;
    if (user) {
      document.getElementById('login-view').style.display = 'none';
      document.getElementById('gate-view').style.display = 'block';
      document.getElementById('subtitle').textContent = "Enter your password to continue";
      document.getElementById('gate-info').textContent = user.email;
    } else {
      document.getElementById('gate-view').style.display = 'none';
      document.getElementById('login-view').style.display = 'block';
      document.getElementById('subtitle').textContent = isSignUp ? "Create your account" : "Sign in with your email and password";
    }
  });

  // Notice load
  getDoc(doc(db, "config", "notice")).then((d) => {
    if (d.exists() && d.data().text) {
      document.getElementById('notice-text').textContent = d.data().text;
      document.getElementById('notice-bar').style.display = 'block';
    }
  });

  function setStatus(msg, cls = '') {
    status.className = 'status ' + cls;
    status.textContent = msg;
  }

  function friendlyError(err) {
    if (err.message === 'INVALID_KEY') return 'Invalid or already used key.';
    switch (err.code) {
      case 'auth/invalid-email': return 'Invalid email address.';
      case 'auth/missing-password': return 'Please enter your password.';
      case 'auth/weak-password': return 'Password must be at least 6 characters.';
      case 'auth/email-already-in-use': return 'This email is already registered. Please sign in.';
      case 'auth/user-not-found':
      case 'auth/wrong-password':
      case 'auth/invalid-credential': return 'Wrong email or password.';
      case 'auth/too-many-requests': return 'Too many attempts. Try again later.';
      case 'auth/requires-recent-login': return 'Please sign in again.';
      case 'permission-denied': return 'Invalid or already used key.';
      case 'auth/operation-not-allowed': return 'Email/Password login is not enabled in Firebase.';
      default: return err.message;
    }
  }

  function redirect(success, timeLeft = 0) {
    const base = "https://mohasin.bro.bd/apk/login?success=" + success;
    window.location.href = (success && timeLeft > 0) ? base + "&time=" + timeLeft : base;
  }

  // Key ek bar-i use kora jay (transaction + Firestore rules dui jaygay check)
  async function registerWithKey(user, key) {
    const keyRef = doc(db, "keys", key);
    const userRef = doc(db, "users", user.uid);
    await runTransaction(db, async (tx) => {
      const k = await tx.get(keyRef);
      if (!k.exists() || k.data().used) throw new Error('INVALID_KEY');
      tx.update(keyRef, { used: true, usedBy: user.uid, usedEmail: user.email, usedAt: Date.now() });
      tx.set(userRef, {
        name: user.displayName || user.email.split('@')[0],
        email: user.email,
        photo: user.photoURL || "",
        key: key,
        disabled: false,
        createdAt: Date.now()
      });
    });
  }

  async function checkAccess(user) {
    setStatus("Checking access...");
    const userRef = doc(db, "users", user.uid);
    const userDoc = await getDoc(userRef);

    if (!userDoc.exists()) {
      // Key chhara toiri hoya account — access nai
      setStatus("❌ Account not activated. A valid key is required.", 'error');
      await signOut(auth);
      return;
    }

    const data = userDoc.data();

    // Disabled check
    if (data.disabled) {
      setStatus("❌ Your access is disabled.", 'error');
      setTimeout(() => redirect(false), 1500);
      return;
    }

    // Time expire check
    const now = Date.now();
    if (data.expireAt && data.expireAt < now) {
      setStatus("⏰ Your time has expired.", 'error');
      setTimeout(() => redirect(false), 1500);
      return;
    }

    // Time বাকি থাকলে pass করো
    const timeLeft = data.expireAt ? data.expireAt - now : 0;
    setStatus("✅ Access granted!", 'success');
    setTimeout(() => redirect(true, timeLeft), 1000);
  }

  window.toggleMode = () => {
    isSignUp = !isSignUp;
    document.getElementById('subtitle').textContent = isSignUp ? "Create your account" : "Sign in with your email and password";
    btn.textContent = isSignUp ? "Create Account" : "Sign In";
    document.getElementById('toggle').textContent = isSignUp ? "Already have an account? Sign in" : "New here? Create account";
    document.getElementById('password').autocomplete = isSignUp ? "new-password" : "current-password";
    document.getElementById('key').style.display = isSignUp ? 'block' : 'none';
    setStatus("");
  };

  window.submitForm = async () => {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    if (!email || !password) {
      setStatus("Enter email and password.", 'error');
      return;
    }
    const key = document.getElementById('key').value.trim().toUpperCase();
    if (isSignUp && !key) {
      setStatus("Enter your access key.", 'error');
      return;
    }
    if (isSignUp && email.toLowerCase() === ADMIN_EMAIL) {
      setStatus("This email can't be registered here.", 'error');
      return;
    }

    btn.disabled = true;
    justSignedIn = true;
    setStatus(isSignUp ? "Creating account..." : "Signing in...");
    try {
      let cred;
      if (isSignUp) {
        cred = await createUserWithEmailAndPassword(auth, email, password);
        try {
          await registerWithKey(cred.user, key);
        } catch (e) {
          await deleteUser(cred.user).catch(() => {}); // key vul hole account rakha hobe na
          throw e;
        }
      } else {
        cred = await signInWithEmailAndPassword(auth, email, password);
      }
      await checkAccess(cred.user);
    } catch (err) {
      justSignedIn = false;
      setStatus(friendlyError(err), 'error');
    } finally {
      btn.disabled = false;
    }
  };

  window.submitGate = async () => {
    const pass = document.getElementById('gate-pass').value;
    const user = auth.currentUser;
    if (!user) { location.reload(); return; }
    if (!pass) { setStatus("Enter your password.", 'error'); return; }
    const gbtn = document.getElementById('gate-btn');
    gbtn.disabled = true;
    setStatus("Checking...");
    try {
      await reauthenticateWithCredential(user, EmailAuthProvider.credential(user.email, pass));
    } catch (err) {
      const wrong = ['auth/invalid-credential', 'auth/wrong-password'].includes(err.code);
      setStatus(wrong ? "❌ Wrong password." : friendlyError(err), 'error');
      gbtn.disabled = false;
      return;
    }
    try {
      await checkAccess(user);
    } catch (err) {
      setStatus(friendlyError(err), 'error');
    } finally {
      gbtn.disabled = false;
    }
  };

  window.logout = async () => {
    await signOut(auth);
    document.getElementById('gate-pass').value = '';
    setStatus("");
  };

  // Enter key submits
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    if (document.getElementById('gate-view').style.display === 'block') window.submitGate();
    else window.submitForm();
  });
</script>
</body>
</html>
