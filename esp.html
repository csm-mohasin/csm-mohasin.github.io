<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSM Smart Home Control</title>
<style>
  :root{
    --bg:#0b0f17; --card:#131a26; --card2:#18212f; --line:#222d3f;
    --text:#e8edf5; --muted:#8190a8; --accent:#4da3ff;
    --on:#22c55e; --off:#ef4444; --warn:#f59e0b;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  .wrap{max-width:760px;margin:0 auto;padding:16px}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0 16px}
  h1{font-size:1.2rem;font-weight:700}
  h1 small{display:block;font-size:.72rem;color:var(--muted);font-weight:400;margin-top:2px}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;padding:6px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--off)}
  .pill.ok .dot{background:var(--on);box-shadow:0 0 8px var(--on)}
  .pill.ok{color:var(--text)}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
  /* login */
  #loginView{max-width:380px;margin:12vh auto 0}
  #loginView h2{font-size:1.1rem;margin-bottom:4px}
  #loginView p{color:var(--muted);font-size:.85rem;margin-bottom:14px}
  input{width:100%;padding:12px 14px;margin-bottom:10px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:1rem;outline:none}
  input:focus{border-color:var(--accent)}
  .btn{border:0;border-radius:10px;padding:12px 14px;font-size:.95rem;font-weight:600;cursor:pointer;color:#fff;background:var(--accent);transition:transform .08s,opacity .2s}
  .btn:active{transform:scale(.97)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.full{width:100%}
  .btn.ghost{background:var(--card2);border:1px solid var(--line);color:var(--text)}
  .btn.on{background:var(--on)} .btn.off{background:var(--off)}
  .err{color:var(--off);font-size:.85rem;min-height:1.2em;margin-top:6px}
  /* dashboard */
  #dash{display:none}
  .bar{display:flex;gap:10px;margin-bottom:14px}
  .bar .btn{flex:1}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .relay{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;transition:border-color .25s,box-shadow .25s}
  .relay.is-on{border-color:var(--on);box-shadow:0 0 0 1px var(--on) inset,0 0 18px rgba(34,197,94,.15)}
  .relay .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .relay .name{font-weight:600}
  .badge{font-size:.72rem;font-weight:700;padding:4px 9px;border-radius:999px;background:#2a3446;color:var(--muted)}
  .badge.on{background:rgba(34,197,94,.18);color:var(--on)}
  .badge.off{background:rgba(239,68,68,.15);color:var(--off)}
  .badge.wait{background:rgba(245,158,11,.18);color:var(--warn)}
  .hint{font-size:.72rem;color:var(--muted);min-height:1.1em;margin-bottom:10px}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  footer{text-align:center;color:var(--muted);font-size:.75rem;padding:22px 0 8px}
  @media (max-width:380px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">

  <!-- LOGIN -->
  <div id="loginView">
    <div class="panel">
      <h2>CSM Smart Home Control</h2>
      <p>Login korte email ar password dao.</p>
      <input id="email" type="email" placeholder="Email" autocomplete="username">
      <input id="password" type="password" placeholder="Password" autocomplete="current-password">
      <button id="loginBtn" class="btn full">Login</button>
      <div id="loginErr" class="err"></div>
    </div>
    <footer>Developer: CSM Mohasin Alam</footer>
  </div>

  <!-- DASHBOARD -->
  <div id="dash">
    <header>
      <h1>CSM Smart Home Control<small id="userMail"></small></h1>
      <div style="display:flex;gap:8px;align-items:center">
        <span id="connPill" class="pill"><span class="dot"></span><span id="connText">Offline</span></span>
        <button id="logoutBtn" class="btn ghost" style="padding:8px 12px">Logout</button>
      </div>
    </header>

    <div class="bar">
      <button id="allOn" class="btn on">ALL ON</button>
      <button id="allOff" class="btn off">ALL OFF</button>
    </div>

    <div id="grid" class="grid"></div>
    <footer>Developer: CSM Mohasin Alam</footer>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getDatabase, ref, onValue, set, update }
  from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

// ===== Firebase config (ager moto, kono path/config change kori ni) =====
const firebaseConfig = {
  apiKey: "AIzaSyATczBXkLVCVpaje7ejU-_rYPbSJx7LHOY",
  authDomain: "getespform.firebaseapp.com",
  databaseURL: "https://getespform-default-rtdb.firebaseio.com",
  projectId: "getespform",
  storageBucket: "getespform.firebasestorage.app",
  messagingSenderId: "746315429668",
  appId: "1:746315429668:web:5b57917675277642ee25b1"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getDatabase(app);

const KEYS = ["relay1","relay2","relay3","relay4"];
let control = {};   // website ja command dise  (/relayControl)
let status  = {};   // ESP8266 asole ja korse    (/relayStatus)
let unsubs  = [];

const $ = id => document.getElementById(id);

// ===== UI build =====
const grid = $("grid");
KEYS.forEach((k,i)=>{
  const d = document.createElement("div");
  d.className = "relay"; d.id = "card-"+k;
  d.innerHTML = `
    <div class="top"><span class="name">Relay ${i+1}</span><span class="badge" id="badge-${k}">--</span></div>
    <div class="hint" id="hint-${k}"></div>
    <div class="btns">
      <button class="btn on"  data-k="${k}" data-v="1">ON</button>
      <button class="btn off" data-k="${k}" data-v="0">OFF</button>
    </div>`;
  grid.appendChild(d);
});

grid.addEventListener("click", e=>{
  const b = e.target.closest("button[data-k]");
  if(!b) return;
  // Boolean hisebe likhi, String na
  set(ref(db, "relayControl/"+b.dataset.k), b.dataset.v === "1").catch(showErr);
});

function setAll(v){
  const o = {}; KEYS.forEach(k=>o[k]=v);
  update(ref(db,"relayControl"), o).catch(showErr);
}
$("allOn").onclick  = ()=>setAll(true);
$("allOff").onclick = ()=>setAll(false);

function render(){
  KEYS.forEach(k=>{
    const card=$("card-"+k), badge=$("badge-"+k), hint=$("hint-"+k);
    const c = control[k], s = status[k];
    let state, text, cls, msg="";
    if(typeof s === "boolean"){
      state = s;
      text = s ? "ON":"OFF"; cls = s ? "on":"off";
      if(typeof c === "boolean" && c !== s){ text="WAIT"; cls="wait"; msg="Device er reply er opekkhay..."; }
    } else {
      // ESP8266 ekhono status pathay ni
      state = !!c;
      text = c===true ? "ON?" : c===false ? "OFF?" : "--"; cls="wait";
      msg = "Device status paoa jay ni";
    }
    card.classList.toggle("is-on", state === true && cls==="on");
    badge.textContent = text;
    badge.className = "badge "+cls;
    hint.textContent = msg;
  });
}

function showErr(e){ alert("Error: "+(e.code||e.message)); }

// ===== Connection status =====
onValue(ref(db,".info/connected"), snap=>{
  const ok = snap.val() === true;
  $("connPill").classList.toggle("ok", ok);
  $("connText").textContent = ok ? "Connected" : "Offline";
});

// ===== Auth =====
$("loginBtn").onclick = async ()=>{
  const btn=$("loginBtn"); $("loginErr").textContent="";
  btn.disabled=true; btn.textContent="Logging in...";
  try{
    await signInWithEmailAndPassword(auth, $("email").value.trim(), $("password").value);
  }catch(e){
    $("loginErr").textContent = "Login hoyni: "+(e.code||e.message);
  }finally{
    btn.disabled=false; btn.textContent="Login";
  }
};
$("password").addEventListener("keydown",e=>{ if(e.key==="Enter") $("loginBtn").click(); });
$("logoutBtn").onclick = ()=>signOut(auth);

onAuthStateChanged(auth, user=>{
  unsubs.forEach(u=>u()); unsubs=[];
  if(user){
    $("loginView").style.display="none";
    $("dash").style.display="block";
    $("userMail").textContent = user.email;
    unsubs.push(onValue(ref(db,"relayControl"), s=>{ control = s.val()||{}; render(); }));
    unsubs.push(onValue(ref(db,"relayStatus"),  s=>{ status  = s.val()||{}; render(); }));
  } else {
    $("dash").style.display="none";
    $("loginView").style.display="block";
    control = {}; status = {};
  }
});
</script>
</body>
</html>
