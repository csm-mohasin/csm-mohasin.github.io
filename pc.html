<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PC Lock</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1220;color:#e8eefc;font-family:system-ui,sans-serif}
  .card{width:min(92vw,360px);background:#131c31;border:1px solid #223055;border-radius:18px;padding:24px;text-align:center}
  h1{font-size:20px;margin:0 0 16px}
  input,button{width:100%;padding:13px;border-radius:12px;border:1px solid #2a3a66;font-size:16px;margin-top:10px}
  input{background:#0b1220;color:#e8eefc}
  button{background:#3b6cff;color:#fff;border:0;font-weight:600;cursor:pointer}
  button.red{background:#e5484d}
  button.green{background:#2fa36b}
  .state{font-size:42px;margin:6px 0}
  .muted{color:#8fa0c8;font-size:13px;margin-top:12px}
  .hide{display:none}
</style>
</head>
<body>
<div class="card">
  <h1>🖥️ PC Control</h1>

  <form id="login">
    <input id="email" type="email" placeholder="Email" autocomplete="username" required>
    <input id="pass" type="password" placeholder="Password" autocomplete="current-password" required>
    <button>Login</button>
  </form>

  <div id="panel" class="hide">
    <div class="state" id="state">…</div>
    <div class="muted" id="sub" style="margin:0 0 6px"></div>
    <button class="red" id="lock">🔒 Lock</button>
    <button class="green" id="unlock">🔓 Unlock</button>
    <button id="logout" style="background:#223055">Logout</button>
  </div>
  <div class="muted" id="msg"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
  // Paste your Firebase web config here
  firebase.initializeApp({
    apiKey: "AIzaSyDP2Ma8tbTaliztjNvWOYsxjW9cWOEdh40",
    authDomain: "csmlockpc.firebaseapp.com",
    databaseURL: "https://csmlockpc-default-rtdb.firebaseio.com",
    projectId: "csmlockpc",
    storageBucket: "csmlockpc.firebasestorage.app",
    messagingSenderId: "1046303844785",
    appId: "1:1046303844785:web:c88c3ab932103562ceb590"
  });

  const $ = id => document.getElementById(id);
  const db = firebase.database();
  const cmdRef = db.ref("pc/lock"), statRef = db.ref("pc/status");
  const TS = firebase.database.ServerValue.TIMESTAMP;
  let offs = [], offset = 0, cmd = null, pc = null, tm = null;
  db.ref(".info/serverTimeOffset").on("value", s => { offset = s.val() || 0; render(); });

  $("login").onsubmit = async e => {
    e.preventDefault();
    try { await firebase.auth().signInWithEmailAndPassword($("email").value, $("pass").value); }
    catch (err) { $("msg").textContent = err.message; }
  };
  $("logout").onclick = () => firebase.auth().signOut();
  const send = v => db.ref().update({ "pc/lock": v, "pc/lockAt": TS }).catch(e => $("msg").textContent = e.message);
  $("lock").onclick = () => send(true);
  $("unlock").onclick = () => send(false);

  function render() {
    const online = pc && pc.ts && (Date.now() + offset - pc.ts) < 45000;
    let big, sub = "Command: " + (cmd === null ? "…" : cmd ? "Lock" : "Unlock");
    if (!pc) { big = "⚪ No report yet"; }
    else if (!online) { big = "⚫ PC offline"; sub += " · last seen " + new Date(pc.ts).toLocaleTimeString(); }
    else if (pc.locked) { big = "🔒 Locked"; }
    else { big = "🔓 Unlocked"; if (pc.override && cmd) sub += " · unlocked with PIN on PC"; }
    $("state").textContent = big;
    $("sub").textContent = sub;
  }

  firebase.auth().onAuthStateChanged(u => {
    $("login").classList.toggle("hide", !!u);
    $("panel").classList.toggle("hide", !u);
    $("msg").textContent = "";
    offs.forEach(f => f()); offs = []; clearInterval(tm);
    if (u) {
      const c = cmdRef.on("value", s => { cmd = s.val() === true; render(); });
      const p = statRef.on("value", s => { pc = null; s.forEach(ch => { pc = ch.val(); return true; }); render(); });
      offs.push(() => cmdRef.off("value", c), () => statRef.off("value", p));
      tm = setInterval(render, 5000);
    }
  });
</script>
</body>
</html>
